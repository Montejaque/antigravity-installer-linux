[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-installer-linux"
version = "1.1.0"
description = "Per-user Linux installer and updater for Google Antigravity App and IDE"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = []

[project.scripts]
antigravity-installer = "antigravity_installer.app:main"

[tool.setuptools.packages.find]
include = ["antigravity_installer*"]
