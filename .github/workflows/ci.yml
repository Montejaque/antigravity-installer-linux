name: Build Antigravity Installer AppImage

on:
  push:
    branches:
      - "v*"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
    timeout-minutes: 40
    steps:
      - name: Install build tools and Git
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git python3 python3-tk python3-dev python3-pip curl ca-certificates file libfuse2 binutils patchelf tar
          python3 -m pip install --upgrade "pip<25"
          python3 -m pip install "pyinstaller==6.11.1" "reportlab==4.2.5"
      - uses: actions/checkout@v4
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Build AppImage and PDF
        run: |
          bash scripts/build-appimage.sh
          python3 scripts/build-help-pdf.py
          test -s dist/Antigravity-Installer-x86_64.AppImage
          test -s dist/Guia-Ayuda-Antigravity.pdf
          file dist/Antigravity-Installer-x86_64.AppImage
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-Installer-Linux-${{ github.ref_name }}
          path: |
            dist/Antigravity-Installer-x86_64.AppImage
            dist/Guia-Ayuda-Antigravity.pdf
          if-no-files-found: error
          retention-days: 30
      - name: Align existing release tag with tested source
        if: startsWith(github.ref, 'refs/heads/v')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --request PATCH \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs/tags/$GITHUB_REF_NAME" \
            --data "{\"sha\":\"$GITHUB_SHA\",\"force\":true}"
      - name: Create GitHub Release and upload assets
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Antigravity Installer ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/Antigravity-Installer-x86_64.AppImage
            dist/Guia-Ayuda-Antigravity.pdf
